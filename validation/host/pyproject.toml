[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hal_ti_validation"
version = "0.1.0"
description = "Hardware-in-the-loop validation of hal-ti drivers with a Digilent Analog Discovery 3"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5", "pyyaml>=6.0", "pytest>=7.4"]

[project.optional-dependencies]
# The WaveForms SDK is reached through ctypes (hal_ti_validation/instruments/dwf.py); it needs the
# Digilent WaveForms runtime installed system wide, not a Python package, so this extra is empty and
# only marks the intent.
ad3 = []
dev = ["ruff>=0.5"]

[project.scripts]
hal-ti-console = "hal_ti_validation.console:main"

[tool.setuptools.packages.find]
include = ["hal_ti_validation*"]

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "hil: needs the firmware on a LaunchPad (skipped without --port)",
    "board_params(argnames, path): parametrise from tests.<path> of the board YAML",
    "family(name): only run on boards of this family (tm4c123 or tm4c129)",
    "requires_option(tag): only run when enabled with --with <tag>",
    "ad3: needs the Analog Discovery 3 (skipped with --no-ad3)",
    "resets_board: the test resets the board on purpose",
    "slow: takes more than a few seconds",
]
filterwarnings = ["error::pytest.PytestUnknownMarkWarning"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008", "B905"]
